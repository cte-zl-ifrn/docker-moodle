global:
  namespace: ava

replicaCount: 1

image:
  repository: ctezlifrn/avamoodledev
  tag: "5.3.0.003-test"
  pullPolicy: Always

securityContext:
  runAsUser: 0

nodeSelector:
  kubernetes.io/hostname: tiberias

service:
  type: ClusterIP
  port: 80
  targetPort: 80

# 🐘 Configuração Unificada do Postgres
postgres:
  enabled: true
  host: "postgres.storage.svc.cluster.local"
  name: "moodle_proximo"
  user: "moodle_user"
  port: 5432
  # Configuração do Vault específica para Postgres
  vault:
    path: "ava/moodle-proximo"      # Caminho no Vault
    key: "postgres-password"        # Chave dentro do segredo
    secretName: "postgres-db-secrets-proximo" # Nome do Secret K8s a ser criado
    secretKey: "password"           # Chave dentro do Secret K8s (para env var)

# 🔴 Configuração Unificada do Redis (Valkey)
redis:
  enabled: true
  host: "valkey.storage.svc.cluster.local"
  port: 6379
  database: "5"
  prefix: "sess_"
  # Configuração do Vault específica para Redis
  vault:
    path: "ava/moodle-proximo"      # Caminho no Vault
    key: "redis-password"           # Chave dentro do segredo
    secretName: "valkey-auth-secret-proximo" # Nome do Secret K8s a ser criado
    secretKey: "redis-password"

persistence:
  enabled: true
  accessMode: ReadWriteOnce
  existingClaim: "lh-moodle-proximo"
  size: 25Gi
  mountPath: /var/moodledata

ingress:
  enabled: true
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
  hosts:
    - host: moodle-proximo.ead.ifrn.edu.br
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: moodle-proximo-tls
      hosts:
        - moodle-proximo.ead.ifrn.edu.br

autoscaling:
  enabled: false

affinity: {}
tolerations: []
serviceAccount:
  create: false

resources:
  requests:
    cpu: "500m"
    memory: "1Gi"
  limits:
    cpu: "2"
    memory: "2Gi"

affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - tiberias
